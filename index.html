<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jirmas Trade Zone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.container{
    width:100%;
    max-width:480px;
    text-align:center;
}

.logo{
    width:145px;
    height:145px;
    border-radius:50%;
    margin:0 auto 22px;
    border:2px solid #d7b55b;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(145deg,#171717,#020202);
    box-shadow:0 0 35px rgba(215,181,91,.25);
}

.logo span{
    font-size:42px;
    font-weight:bold;
    color:#d7b55b;
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

.subtitle{
    color:#bdbdbd;
    font-size:16px;
    line-height:1.6;
    margin-bottom:25px;
}

.members{
    font-size:15px;
    color:#d7b55b;
    margin-bottom:25px;
}

.telegram{
    display:block;
    width:100%;
    padding:18px;
    border-radius:14px;
    background:#229ED9;
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 10px 30px rgba(34,158,217,.25);
    transition:.2s;
}

.telegram:hover{
    transform:translateY(-2px);
}

.features{
    margin-top:28px;
    display:grid;
    gap:12px;
}

.feature{
    background:#141414;
    border:1px solid #262626;
    border-radius:12px;
    padding:15px;
    color:#ddd;
}

.footer{
    margin-top:30px;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>JT</span>
    </div>

    <h1>JIRMAS TRADE ZONE 📈</h1>

    <p class="subtitle">
        Trading Education, Market Analysis<br>
        & Trading Insights
    </p>

    <div class="members">
        🔥 21,000+ Telegram Subscribers
    </div>

    <a class="telegram"
       href="https://t.me/jirmastradezone"
       target="_blank">
       🚀 JOIN TELEGRAM CHANNEL
    </a>

    <div class="features">

        <div class="feature">
            📊 Market Analysis
        </div>

        <div class="feature">
            📈 Trading Insights
        </div>

        <div class="feature">
            🎯 Trading Education
        </div>

        <div class="feature">
            🔔 Daily Market Updates
        </div>

    </div>

    <div class="footer">
        ©️ 2026 Jirmas Trade Zone
    </div>

</div>

</body>
</html>
